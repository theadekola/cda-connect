name: cda-connect
services:
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      CDA_DOMAIN: ${CDA_DOMAIN:?Set CDA_DOMAIN to your real HTTPS hostname}
    # cloudflared runs on the same Ubuntu host and forwards to localhost:8080.
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app]
    depends_on:
      api: { condition: service_healthy }
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      CORS_ORIGIN: https://${CDA_DOMAIN:?Set CDA_DOMAIN}
      PUBLIC_BASE_URL: https://${CDA_DOMAIN:?Set CDA_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}@redis:6379
    volumes: ["uploads:/app/uploads", "private_uploads:/app/private-uploads"]
    networks: [app, queue]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  worker:
    build: ./backend
    command: ["node", "dist/workers/worker.js"]
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ./backend/.env.production
    environment:
      CORS_ORIGIN: https://${CDA_DOMAIN:?Set CDA_DOMAIN}
      PUBLIC_BASE_URL: https://${CDA_DOMAIN:?Set CDA_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}@redis:6379
    volumes: ["uploads:/app/uploads", "private_uploads:/app/private-uploads"]
    networks: [app, queue]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-fs.statSync('/tmp/cda-worker-ready').mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis_data:/data"]
    networks: [queue]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  app:
  queue:
    internal: true
volumes:
  uploads:
  private_uploads:
  redis_data:
  caddy_data:
  caddy_config:

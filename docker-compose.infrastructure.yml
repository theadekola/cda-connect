services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["node", "dist/server.js"]
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default
      - backend

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["node", "dist/workers/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cda-worker-ready && kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 4
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass '$${REDIS_PASSWORD}' --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cda-connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-cda-connect} $${MINIO_ROOT_PASSWORD:-change-me-minio-password}; do sleep 2; done;
      mc mb --ignore-existing local/cda-connect;
      mc anonymous set download local/cda-connect;
      exit 0;"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cda-connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}

volumes:
  redis-data:
  minio-data:

networks:
  backend:
    internal: true

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: ["node", "dist/server.js"]
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: ["node", "dist/workers/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cda-connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-cda-connect} $${MINIO_ROOT_PASSWORD:-change-me-minio-password}; do sleep 2; done;
      mc mb --ignore-existing local/cda-connect;
      mc anonymous set download local/cda-connect;
      exit 0;"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cda-connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}

volumes:
  redis-data:
  minio-data:

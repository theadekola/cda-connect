allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
overrides:
  engine.io: 6.6.10
# Permit the newly released security fix while retaining pnpm's default
# minimum-release-age protection for every other dependency.
minimumReleaseAgeExclude:
  - express@5.3.0
  - sharp@0.35.5
# GHSA-hp3w-g68c-fv3c: cap floating-point precision until an upstream fix is released.
# Keep the audit finding visible; SQL formatting compatibility is regression-tested.
patchedDependencies:
  sprintf-js@1.1.3: patches/sprintf-js@1.1.3.patch

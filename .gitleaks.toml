[extend]
useDefault = true
[[allowlists]]
description = "Documented deployment placeholder (not a credential)"
condition = "AND"
paths = ['''^deploy/\.env\.example$''']
regexTarget = "secret"
regexes = ['''^REPLACE_WITH_64_HEX_CHARACTERS$''']

[[allowlists]]
description = "README deployment placeholder retained in reachable documentation history (not a credential)"
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "match"
regexes = ['''^DB_PASSWORD=<secure-secret>
'']

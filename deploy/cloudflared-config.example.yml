# For an existing locally managed cloudflared service on the application host.
# Preserve its real tunnel ID, credentials-file and other ingress rules.
# Remotely managed tunnels: configure this hostname and service in the dashboard instead.
tunnel: REPLACE_WITH_EXISTING_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_WITH_EXISTING_TUNNEL_ID.json
ingress:
  - hostname: cdaconnect.org
    service: http://127.0.0.1:8080
  - service: http_status:404

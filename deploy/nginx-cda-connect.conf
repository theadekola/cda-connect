# cloudflared is a host service forwarding cdaconnect.org to localhost:8080.
map $http_upgrade $cda_connection_upgrade {
    default upgrade;
    '' close;
}
# Only the public welcome page belongs in search results.
# Authentication still protects member content; noindex is not access control.
map $request_uri $cda_search_robots {
    default "noindex, nofollow";
    / "index, follow";
    ~^/\? "index, follow";
}
server {
    listen 127.0.0.1:8080;
    server_name cdaconnect.org;
    root /opt/cda-connect/current/frontend/dist;
    index index.html;
    client_max_body_size 30m;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api/|socket\.io/|uploads/|health$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cda_connection_upgrade;
        proxy_read_timeout 90s;
    }
    # Bundles are content-versioned. Missing chunks must never return index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $cda_search_robots always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $cda_search_robots always;
    }
}
